<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapleStoryTools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="./assets/theme.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="./index.html" class="brand">MapleStoryTools</a>

      <nav class="nav-right" aria-label="主導覽列">
        <ul id="nav-links" class="nav-links">
          <li id="tools-dropdown" class="nav-dropdown">
            <button id="tools-dropdown-toggle" class="nav-dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false">
              <span>工具列表</span>
              <svg class="nav-dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <ul class="nav-dropdown-menu" aria-label="工具列表子選單">
              <li><a href="./gear-gain.html" class="nav-dropdown-item">裝備提升收益計算器</a></li>
            </ul>
          </li>
        </ul>

        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切換深色或淺色模式">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <button id="mobile-menu-toggle" class="icon-btn mobile-menu-btn" type="button" aria-label="開啟選單" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="main-container blank-canvas" aria-label="首頁預留空間"></main>

  <footer class="footer">
    <span>MapleStoryTools</span>
  </footer>
</body>
</html>
